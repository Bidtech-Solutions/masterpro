version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - nilerr
    - noctx
    - revive
    - unconvert
  settings:
    gosec:
      excludes:
        - G104 # error tidak dicek pada Close/defer — ditangani errcheck
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    presets:
      - comments
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [gosec, noctx, errcheck]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/bidtech-solutions/masterpro/backend
