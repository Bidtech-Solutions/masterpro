# MasterPro — stack development lokal (PRD §15.4).
#   cp .env.example .env && docker compose up -d --build
# Website http://localhost/id · Dashboard http://localhost/dashboard · API http://localhost/api/v1/health
# Media http://media.localhost · Console RustFS http://localhost:9001 · Dashboard Traefik http://localhost:8081
name: masterpro

services:
  traefik:
    image: traefik:v3.7
    command:
      - --api.insecure=true
      - --log.level=INFO
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=masterpro_dev
      - --entrypoints.web.address=:80
    ports:
      - "80:80"
      - "127.0.0.1:8081:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      default:
        # agar container frontend dapat mengambil gambar media.localhost untuk Image Optimization
        aliases: [media.localhost]
    labels:
      - traefik.enable=true
      - traefik.http.middlewares.mp-media-prefix.addprefix.prefix=/${S3_BUCKET}

  frontend:
    build: { context: ./frontend, target: dev }
    environment:
      INTERNAL_API_URL: ${INTERNAL_API_URL}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      NEXT_PUBLIC_MEDIA_URL: ${NEXT_PUBLIC_MEDIA_URL}
      NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID:-}
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on: [backend]
    labels:
      - traefik.enable=true
      - traefik.http.routers.mp-web.rule=Host(`localhost`)
      - traefik.http.routers.mp-web.entrypoints=web
      - traefik.http.routers.mp-web.priority=10
      - traefik.http.services.mp-web.loadbalancer.server.port=3000

  backend:
    build: { context: ./backend, target: dev }
    env_file: .env
    environment:
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backend:/src
      - backend_gocache:/root/.cache/go-build
    depends_on:
      postgres: { condition: service_healthy }
      rustfs: { condition: service_started }
    labels:
      - traefik.enable=true
      - traefik.http.routers.mp-api.rule=Host(`localhost`) && PathPrefix(`/api`)
      - traefik.http.routers.mp-api.entrypoints=web
      - traefik.http.routers.mp-api.priority=50
      - traefik.http.services.mp-api.loadbalancer.server.port=8080

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # DB kosong tambahan untuk test integrasi backend (make test-integration)
      - ./backend/testdata/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  rustfs-perms:
    image: alpine:3.22
    user: root
    command: ["sh", "-c", "chown -R 10001:10001 /data"]
    volumes: [rustfs_data:/data]
    restart: "no"

  rustfs:
    image: rustfs/rustfs:1.0.4
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
    ports: ["127.0.0.1:9001:9001"]
    volumes: [rustfs_data:/data]
    depends_on:
      rustfs-perms: { condition: service_completed_successfully }
    labels:
      - traefik.enable=true
      - traefik.http.routers.mp-media.rule=Host(`media.localhost`)
      - traefik.http.routers.mp-media.entrypoints=web
      - traefik.http.routers.mp-media.middlewares=mp-media-prefix
      - traefik.http.services.mp-media.loadbalancer.server.port=9000
      - traefik.http.services.mp-media.loadbalancer.passhostheader=false

networks:
  default:
    name: masterpro_dev

volumes:
  postgres_data:
  rustfs_data:
  backend_gocache:
