# MasterPro — stack produksi (PRD §15.3).
# Dijalankan di VPS (/opt/masterpro) oleh GitHub Actions:
#   docker compose -f docker-compose.prod.yml --env-file .env up -d
#
# Stack ini TIDAK membawa Traefik sendiri: ia bergabung ke Traefik yang sudah berjalan di VPS
# (container Traefik-Proxy, network `traefik-network`, entrypoint `websecure`, certresolver `letsencrypt`).
# Bila Traefik di VPS diganti/diubah namanya, sesuaikan tiga nilai itu di file ini
# (network di bagian `networks`, `entrypoints` dan `tls.certresolver` di label).
#
# Nama service diberi awalan `mp-` karena bergabung ke network bersama `traefik-network`:
# nama generik (backend/frontend/postgres) bisa bentrok dengan project lain di network itu.
# .env dibuat CI dari GitHub Secrets.
name: masterpro

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  mp-frontend:
    image: ${IMAGE_REGISTRY}/masterpro-frontend:${IMAGE_TAG}
    restart: unless-stopped
    logging: *logging
    environment:                      # sengaja eksplisit: frontend tidak menerima secret DB/JWT/S3
      NODE_ENV: production
      INTERNAL_API_URL: ${INTERNAL_API_URL}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      NEXT_PUBLIC_MEDIA_URL: ${NEXT_PUBLIC_MEDIA_URL}
    volumes:
      - frontend_cache:/app/.next/cache
    networks: [ traefik, internal ]
    depends_on:
      mp-backend: { condition: service_healthy }
    deploy:
      resources: { limits: { memory: 640m } }
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-network
      # --- middleware bersama (awalan mp- agar tidak bentrok dengan project lain) ---
      - traefik.http.middlewares.mp-www-redirect.redirectregex.regex=^https?://www\.(.*)
      - traefik.http.middlewares.mp-www-redirect.redirectregex.replacement=https://$${1}
      - traefik.http.middlewares.mp-www-redirect.redirectregex.permanent=true
      - traefik.http.middlewares.mp-secure-headers.headers.stsSeconds=31536000
      - traefik.http.middlewares.mp-secure-headers.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.mp-secure-headers.headers.contentTypeNosniff=true
      - traefik.http.middlewares.mp-secure-headers.headers.frameDeny=true
      - traefik.http.middlewares.mp-secure-headers.headers.referrerPolicy=strict-origin-when-cross-origin
      - traefik.http.middlewares.mp-secure-headers.headers.permissionsPolicy=camera=(), microphone=(), geolocation=()
      - traefik.http.middlewares.mp-compress.compress=true
      - traefik.http.middlewares.mp-deny-public.ipallowlist.sourcerange=127.0.0.1/32
      # --- web ---
      - traefik.http.services.mp-web.loadbalancer.server.port=3000
      - traefik.http.routers.mp-web.rule=Host(`${DOMAIN}`) || Host(`www.${DOMAIN}`)
      - traefik.http.routers.mp-web.entrypoints=websecure
      - traefik.http.routers.mp-web.tls.certresolver=letsencrypt
      - traefik.http.routers.mp-web.priority=10
      - traefik.http.routers.mp-web.service=mp-web
      - traefik.http.routers.mp-web.middlewares=mp-www-redirect,mp-secure-headers,mp-compress
      # blokir /internal/* dari publik (hanya untuk jaringan Docker)
      - traefik.http.routers.mp-web-internal.rule=(Host(`${DOMAIN}`) || Host(`www.${DOMAIN}`)) && PathPrefix(`/internal`)
      - traefik.http.routers.mp-web-internal.entrypoints=websecure
      - traefik.http.routers.mp-web-internal.tls.certresolver=letsencrypt
      - traefik.http.routers.mp-web-internal.priority=100
      - traefik.http.routers.mp-web-internal.service=mp-web
      - traefik.http.routers.mp-web-internal.middlewares=mp-deny-public

  mp-backend:
    image: ${IMAGE_REGISTRY}/masterpro-backend:${IMAGE_TAG}
    restart: unless-stopped
    logging: *logging
    env_file: .env
    environment:
      APP_ENV: production
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    networks: [ traefik, internal ]
    depends_on:
      mp-postgres: { condition: service_healthy }
      mp-rustfs: { condition: service_started }
    deploy:
      resources: { limits: { memory: 256m } }
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-network
      - traefik.http.middlewares.mp-api-ratelimit.ratelimit.average=30
      - traefik.http.middlewares.mp-api-ratelimit.ratelimit.burst=60
      # Bila domain diproksi Cloudflare, hitung rate limit per IP klien asli:
      - traefik.http.middlewares.mp-api-ratelimit.ratelimit.sourcecriterion.requestheadername=CF-Connecting-IP
      - traefik.http.services.mp-api.loadbalancer.server.port=8080
      - traefik.http.routers.mp-api.rule=(Host(`${DOMAIN}`) || Host(`www.${DOMAIN}`)) && PathPrefix(`/api`)
      - traefik.http.routers.mp-api.entrypoints=websecure
      - traefik.http.routers.mp-api.tls.certresolver=letsencrypt
      - traefik.http.routers.mp-api.priority=50
      - traefik.http.routers.mp-api.service=mp-api
      - traefik.http.routers.mp-api.middlewares=mp-www-redirect,mp-secure-headers,mp-api-ratelimit

  mp-postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [ internal ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources: { limits: { memory: 512m } }

  mp-rustfs-perms:
    image: alpine:3.22
    user: root
    command: [ "sh", "-c", "chown -R 10001:10001 /data" ]
    volumes:
      - rustfs_data:/data
    restart: "no"
    logging: *logging

  mp-rustfs:
    image: rustfs/rustfs:1.0.4
    restart: unless-stopped
    logging: *logging
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
    volumes:
      - rustfs_data:/data
    ports:
      - "127.0.0.1:9101:9001"   # console hanya via SSH tunnel
    networks: [ traefik, internal ]
    depends_on:
      mp-rustfs-perms: { condition: service_completed_successfully }
    deploy:
      resources: { limits: { memory: 512m } }
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-network
      - traefik.http.middlewares.mp-media-prefix.addprefix.prefix=/${S3_BUCKET}
      - traefik.http.services.mp-media.loadbalancer.server.port=9000
      - traefik.http.services.mp-media.loadbalancer.passhostheader=false
      - traefik.http.routers.mp-media.rule=Host(`${MEDIA_DOMAIN}`) && (Method(`GET`) || Method(`HEAD`))
      - traefik.http.routers.mp-media.entrypoints=websecure
      - traefik.http.routers.mp-media.tls.certresolver=letsencrypt
      - traefik.http.routers.mp-media.service=mp-media
      - traefik.http.routers.mp-media.middlewares=mp-media-prefix,mp-compress

networks:
  traefik:
    name: traefik-network
    external: true
  internal:
    name: masterpro_internal
    internal: true

volumes:
  frontend_cache:
  postgres_data:
  rustfs_data: