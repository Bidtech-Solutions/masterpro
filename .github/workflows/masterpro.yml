# MasterPro CI/CD (PRD §16). Jalur frontend & backend paralel; deploy hanya dari main.
# Daftar Secrets/Variables yang wajib diisi: README.md → "GitHub Secrets & Variables".
name: MasterPro CI/CD

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: masterpro-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  SHOULD_PUSH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      registry: ${{ steps.vars.outputs.registry }}
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - id: vars
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "registry=ghcr.io/${OWNER}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

  frontend-quality:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test          # termasuk test kesamaan kunci messages/id.json & en.json

  backend-quality:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: masterpro_test
          POSTGRES_USER: masterpro
          POSTGRES_PASSWORD: masterpro
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd "pg_isready -U masterpro" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://masterpro:masterpro@localhost:5432/masterpro_test?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15
          working-directory: backend
      - run: go test -race -count=1 ./...

  frontend-image:
    needs: [ meta, frontend-quality ]
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - if: env.SHOULD_PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          target: runner
          push: ${{ env.SHOULD_PUSH == 'true' }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=https://${{ vars.DOMAIN }}
            NEXT_PUBLIC_MEDIA_URL=https://${{ vars.MEDIA_DOMAIN }}
          tags: |
            ${{ needs.meta.outputs.registry }}/masterpro-frontend:${{ needs.meta.outputs.tag }}
            ${{ needs.meta.outputs.registry }}/masterpro-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  backend-image:
    needs: [ meta, backend-quality ]
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - if: env.SHOULD_PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: runner
          push: ${{ env.SHOULD_PUSH == 'true' }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ${{ needs.meta.outputs.registry }}/masterpro-backend:${{ needs.meta.outputs.tag }}
            ${{ needs.meta.outputs.registry }}/masterpro-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

  deploy-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validasi compose produksi
        run: cp .env.example .env && docker compose -f docker-compose.prod.yml config -q
      - uses: actions/upload-artifact@v4
        with:
          name: deploy-bundle
          include-hidden-files: true
          path: |
            docker-compose.prod.yml
            .env.example
          retention-days: 7

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [ meta, frontend-image, backend-image, deploy-bundle ]
    runs-on: ubuntu-latest
    environment: production
    permissions: { contents: read, packages: read }
    steps:
      - uses: actions/download-artifact@v4
        with: { name: deploy-bundle, path: bundle }

      - name: Siapkan SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          echo "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host vps
            HostName ${{ secrets.VPS_HOST }}
            Port ${{ secrets.VPS_PORT }}
            User ${{ secrets.VPS_USER }}
            IdentityFile ~/.ssh/id_deploy
          EOF

      - name: Buat .env produksi dari secrets
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          umask 077
          cat > bundle/.env <<EOF
          COMPOSE_PROJECT_NAME=masterpro
          DOMAIN=${{ vars.DOMAIN }}
          MEDIA_DOMAIN=${{ vars.MEDIA_DOMAIN }}
          IMAGE_REGISTRY=${{ needs.meta.outputs.registry }}
          IMAGE_TAG=${{ needs.meta.outputs.tag }}
          POSTGRES_DB=masterpro
          POSTGRES_USER=masterpro
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          APP_ENV=production
          APP_PORT=8080
          LOG_LEVEL=info
          DB_HOST=mp-postgres
          DB_PORT=5432
          DB_SSLMODE=disable
          RUN_MIGRATIONS=true
          JWT_SECRET=${JWT_SECRET}
          JWT_ACCESS_TTL=15m
          JWT_REFRESH_TTL=168h
          COOKIE_SECURE=true
          CORS_ALLOWED_ORIGINS=https://${{ vars.DOMAIN }}
          TRUSTED_PLATFORM=
          S3_ENDPOINT=mp-rustfs:9000
          S3_USE_SSL=false
          S3_REGION=us-east-1
          S3_ACCESS_KEY=${S3_ACCESS_KEY}
          S3_SECRET_KEY=${S3_SECRET_KEY}
          S3_BUCKET=masterpro-media
          MEDIA_PUBLIC_URL=https://${{ vars.MEDIA_DOMAIN }}
          FRONTEND_INTERNAL_URL=http://mp-frontend:3000
          REVALIDATE_SECRET=${REVALIDATE_SECRET}
          NEXT_PUBLIC_SITE_URL=https://${{ vars.DOMAIN }}
          NEXT_PUBLIC_MEDIA_URL=https://${{ vars.MEDIA_DOMAIN }}
          INTERNAL_API_URL=http://mp-backend:8080
          EOF

      - name: Kirim bundle ke /opt/masterpro
        # /opt/masterpro dibuat sekali oleh root & dimiliki user deploy (lihat §17.1)
        run: |
          scp bundle/docker-compose.prod.yml bundle/.env.example vps:/opt/masterpro/
          scp bundle/.env vps:/opt/masterpro/.env.new
          ssh vps 'bash -s' <<'EOF'
          set -e
          cd /opt/masterpro
          if [ -f .env ]; then cp .env .env.previous; chmod 600 .env.previous; fi
          mv .env.new .env && chmod 600 .env
          EOF

      - name: Login GHCR di VPS
        # Token otomatis milik run ini (berlaku sementara); tidak perlu PAT/secret tambahan.
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | ssh vps "docker login ghcr.io -u '$GHCR_USER' --password-stdin"

      - name: Pull & jalankan
        run: |
          ssh vps 'bash -s' <<'EOF'
          set -e
          cd /opt/masterpro
          DC="docker compose -f docker-compose.prod.yml --env-file .env"
          $DC pull
          docker logout ghcr.io
          $DC up -d --remove-orphans
          for svc in mp-backend mp-frontend; do
            status=""
            for i in $(seq 1 36); do
              status=$(docker inspect -f '{{.State.Health.Status}}' "$($DC ps -q $svc)" 2>/dev/null || true)
              [ "$status" = "healthy" ] && break
              sleep 5
            done
            if [ "$status" != "healthy" ]; then $DC logs --tail=150 $svc; exit 1; fi
          done
          docker image prune -f
          EOF

      - name: Revalidasi cache ISR
        run: |
          ssh vps 'bash -s' <<'EOF'
          cd /opt/masterpro
          docker compose -f docker-compose.prod.yml exec -T mp-frontend node -e '
            fetch("http://127.0.0.1:3000/internal/revalidate", { method: "POST",
              headers: { "content-type": "application/json", "x-revalidate-secret": process.env.REVALIDATE_SECRET },
              body: JSON.stringify({ all: true, tags: ["properties:list", "reference"] }) })
            .then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))'
          EOF

      - name: Smoke test
        run: |
          curl -fsS --retry 5 --retry-delay 5 https://${{ vars.DOMAIN }}/api/v1/health
          curl -fsS -o /dev/null --retry 5 --retry-delay 5 https://${{ vars.DOMAIN }}/id